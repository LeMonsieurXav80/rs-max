<!-- Slide de fin : accroche, précision, pastille de compte. -->
<div style="position:absolute; inset:0;
            background:linear-gradient(160deg, var(--bg) 0%, var(--bg) 55%, var(--accent) 150%);">
  {{#if image}}
    <img src="{{ image }}" alt=""
         style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;">
    <div class="brick-scrim"></div>
  {{/if}}

  <div style="position:absolute; inset:0; display:flex; flex-direction:column;
              justify-content:var(--justify); align-items:var(--align);
              padding:10cqw;">
    <div style="text-align:var(--text-align); max-width:100%;">
      {{#if title}}
        <h2 style="margin:0; font-family:var(--title-font); font-weight:800;
                   font-size:7.2cqh; line-height:1.06; letter-spacing:-0.02em;
                   color:var(--text); text-wrap:balance;">{{ title }}</h2>
      {{/if}}
      {{#if subtitle}}
        <p style="margin:2.8cqh auto 0; max-width:80cqw; font-family:var(--body-font);
                  font-weight:400; font-size:3cqh; line-height:1.4;
                  color:var(--text); opacity:0.85;">{{ subtitle }}</p>
      {{/if}}
      {{#if handle}}
        <div style="margin-top:4.5cqh;">
          <span style="display:inline-block; padding:1.4cqh 4.5cqw; border-radius:999px;
                       background:var(--accent); font-family:var(--title-font);
                       font-weight:700; font-size:3cqh; line-height:1.4;
                       color:#ffffff;">{{ handle }}</span>
        </div>
      {{/if}}
    </div>
  </div>
</div>
