<!-- Citation : guillemet d'accent, texte en police de titre, auteur discret. -->
<div style="position:absolute; inset:0; background:var(--bg);">
  {{#if image}}
    <img src="{{ image }}" alt=""
         style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;">
    <div class="brick-scrim"></div>
  {{/if}}

  <div style="position:absolute; inset:0; display:flex; flex-direction:column;
              justify-content:var(--justify); align-items:var(--align);
              padding:10cqw;">
    <div style="text-align:var(--text-align); max-width:100%;">
      <div style="font-family:var(--title-font); font-weight:800; font-size:16cqh;
                  line-height:0.7; color:var(--accent); margin-bottom:1.5cqh;">&ldquo;</div>

      {{#if quote}}
        <p style="margin:0; font-family:var(--title-font); font-weight:700;
                  font-size:6.2cqh; line-height:1.22; letter-spacing:-0.01em;
                  color:var(--text); text-wrap:balance;">{{ quote }}</p>
      {{/if}}
      {{#if author}}
        <p style="margin:3.5cqh 0 0; font-family:var(--body-font); font-weight:400;
                  font-size:2.6cqh; line-height:1.3; color:var(--text); opacity:0.7;">— {{ author }}</p>
      {{/if}}
    </div>
  </div>
</div>
